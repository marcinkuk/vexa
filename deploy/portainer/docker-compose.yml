# Vexa Lite as a Portainer stack.
#
# Same three pieces as `make -C deploy/lite up`: the all-in-one control-plane
# container, a Postgres sidecar, and the versitygw storage sidecar. Lite runs
# meeting bots as in-container processes, so this stack needs no Docker socket
# and builds nothing — images come from Docker Hub.
#
# Secrets live in ONE file under /data/vexa (SECRETS_FILE, default
# /data/vexa/stack.secrets.env), created by `sh deploy/portainer/init-host.sh`.
# /data is Portainer's data directory and is mounted into the Portainer
# container, so the compose CLI it runs can read the env_file; the same path
# exists on the host, which is what the daemon needs for the seccomp profile.
# Nothing secret is committed and nothing secret is kept in Portainer's
# database: a git re-scan overwrites the stack's project directory, so a
# committed secret would be both published and destroyed on the next update.
#
# Portainer sets COMPOSE_PROJECT_NAME from the stack name, so containers and
# volumes are prefixed with it (vexa_vexa-lite-1, vexa_vexa-pgdata, ...).
name: vexa

x-secrets: &secrets
  env_file:
    - ${SECRETS_FILE:-/data/vexa/stack.secrets.env}

services:
  vexa-lite:
    <<: *secrets
    # Pin IMAGE_TAG to a release (e.g. v0.12.29) so a re-deploy cannot silently
    # move to a new build.
    image: vexaai/vexa-lite:${IMAGE_TAG:-v0.12.29}
    # Chromium's sandbox inside a meeting bot needs an unprivileged user
    # namespace, which Docker's default seccomp profile denies. Docker resolves
    # a seccomp path on the daemon, so it must be an absolute host path:
    #   sh deploy/portainer/init-host.sh
    # then SECCOMP_PROFILE in the Portainer stack env points at it. Without it
    # bots run an unsandboxed browser (Lite logs that).
    security_opt:
      - seccomp=${SECCOMP_PROFILE:-unconfined}
    # env_file injects DB_PASSWORD / ADMIN_TOKEN / MINIO_* into the container;
    # refuse empty or repository-published values before anything starts.
    # /bin/sh -c consumes CMD, so the Lite CMD is repeated here as the script's
    # own args — /entrypoint.sh needs it both to render supervisord.conf and to
    # exec it.
    entrypoint:
      - /bin/sh
      - -c
      - |
        for k in DB_PASSWORD ADMIN_TOKEN MINIO_ACCESS_KEY MINIO_SECRET_KEY; do
          eval "v=\$$k"
          case "$$v" in
            ""|changeme|change-me|CHANGE-ME|default|secret|password|postgres|vexa-internal-secret|lite-internal-secret|vexa-access-key|vexa-secret-key)
              echo "refusing to start: $$k is unset or a value published in the Vexa repository." >&2
              echo "  Populate ${SECRETS_FILE:-/data/vexa/stack.secrets.env} with sh deploy/portainer/init-host.sh, then re-deploy." >&2
              exit 1;;
          esac
        done
        export ADMIN_API_TOKEN="$$ADMIN_TOKEN"
        # Images ≥ v0.13 run the entrypoint-rendered config; older ones run the
        # shipped template directly. Pick whichever exists.
        conf=/run/vexa/supervisord.conf
        [ -f "$$conf" ] || conf=/etc/supervisor/conf.d/vexa.conf
        exec /entrypoint.sh supervisord -n -c "$$conf"
    shm_size: 2g
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-vexa}
      DB_USER: ${DB_USER:-postgres}
      MINIO_ENDPOINT: storage:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-vexa}
      MINIO_SECURE: "false"
      TRANSCRIPTION_SERVICE_URL: ${TRANSCRIPTION_SERVICE_URL:-}
      TRANSCRIPTION_SERVICE_TOKEN: ${TRANSCRIPTION_SERVICE_TOKEN:-}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-}
      TRANSCRIBE_ENABLED: ${TRANSCRIBE_ENABLED:-}
      RECORDING_ENABLED: ${RECORDING_ENABLED:-}
      VEXA_PUBLIC_API_URL: ${VEXA_PUBLIC_API_URL:-http://localhost:8056}
      TERMINAL_PUBLIC_URL: ${TERMINAL_PUBLIC_URL:-http://localhost:3001}
      TZ: UTC
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${GATEWAY_HOST_PORT:-8056}:8056"
      - "${BIND_ADDR:-0.0.0.0}:${TERMINAL_HOST_PORT:-3001}:3001"
      - "${BIND_ADDR:-0.0.0.0}:${AGENT_HOST_PORT:-8100}:8100"
    volumes:
      # Minted secrets that must survive container replacement (terminal
      # sign-in link secret, self-host API key).
      - vexa-state:/var/lib/vexa/state
    networks: [vexa]
    restart: unless-stopped
    mem_limit: ${LITE_MEM_LIMIT:-2g}
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully

  postgres:
    <<: *secrets
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$$DB_PASSWORD" in
          ""|changeme|change-me|CHANGE-ME|default|secret|password|postgres|vexa-internal-secret)
            echo "refusing to start: DB_PASSWORD is unset or a value published in the Vexa repository." >&2
            echo "  Populate ${SECRETS_FILE:-/data/vexa/stack.secrets.env} with sh deploy/portainer/init-host.sh." >&2
            exit 1;;
        esac
        export POSTGRES_PASSWORD="$$DB_PASSWORD"
        exec docker-entrypoint.sh "$$@"
      - --
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60000", "-c", "hba_file=/data/vexa/pg_hba.conf"]
    environment:
      POSTGRES_DB: ${DB_NAME:-vexa}
      POSTGRES_USER: ${DB_USER:-postgres}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - vexa-pgdata:/var/lib/postgresql/data
      # hba_file via bind, not init: a re-deploy keeps the volume and skips initdb.
      - ${SECRETS_DIR:-/data/vexa}/pg_hba.conf:/data/vexa/pg_hba.conf:ro
    networks: [vexa]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vexa}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # initdb is skipped when the data volume already holds a cluster, so POSTGRES_DB
  # would never be applied — one-shot psql creates the database if it is missing.
  db-init:
    <<: *secrets
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    entrypoint:
      - /bin/sh
      - -c
      - |
        export PGPASSWORD="$$DB_PASSWORD" PGHOST=postgres PGUSER="$${DB_USER:-postgres}"
        psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${DB_NAME:-vexa}'" | grep -q 1 \
          || psql -d postgres -c "CREATE DATABASE ${DB_NAME:-vexa}" \
          || echo "database ${DB_NAME:-vexa} already present"
    networks: [vexa]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  storage:
    <<: *secrets
    # Recordings as plain files in the volume: back the volume up with an
    # attribute-preserving copy (rsync -aX, cp -a) — S3 metadata rides in xattrs.
    image: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$$MINIO_ACCESS_KEY" in
          ""|vexa-access-key|vexa-secret-key|minioadmin|changeme|default|secret|password)
            echo "refusing to start: MINIO_ACCESS_KEY is unset or a value published in the Vexa repository." >&2
            exit 1;;
        esac
        case "$$MINIO_SECRET_KEY" in
          ""|vexa-access-key|vexa-secret-key|minioadmin|changeme|default|secret|password)
            echo "refusing to start: MINIO_SECRET_KEY is unset or a value published in the Vexa repository." >&2
            exit 1;;
        esac
        mkdir -p /srv/vexa-storage/data /srv/vexa-storage/iam
        ROOT_ACCESS_KEY="$$MINIO_ACCESS_KEY" ROOT_SECRET_KEY="$$MINIO_SECRET_KEY" \
          exec versitygw --port :9000 --health /health --iam-dir /srv/vexa-storage/iam --quiet posix /srv/vexa-storage/data
    volumes:
      - vexa-storagedata:/srv/vexa-storage
    networks: [vexa]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The bucket must exist before meeting-api writes to it; versitygw's own admin
  # CLI does it once against the running gateway.
  storage-init:
    <<: *secrets
    image: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
    entrypoint:
      - /bin/sh
      - -c
      - |
        ADMIN_ACCESS_KEY="$$MINIO_ACCESS_KEY" ADMIN_SECRET_KEY="$$MINIO_SECRET_KEY" \
          versitygw admin --endpoint-url http://storage:9000 \
          create-bucket --bucket ${MINIO_BUCKET:-vexa} --owner "$$MINIO_ACCESS_KEY" \
          || echo "bucket ${MINIO_BUCKET:-vexa} already present"
    networks: [vexa]
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy

  # Optional CPU Whisper for smoke tests only: the default model is English-only,
  # so Polish meetings need a real endpoint in TRANSCRIPTION_SERVICE_URL.
  # Enable with COMPOSE_PROFILES=local-stt in the Portainer stack env.
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu@sha256:760e5e43d427dc6cfbbc4731934b908b7de9c7e6d5309c6a1f0c8c923a5b6030
    profiles: [local-stt]
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-tiny.en}
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__TTL: "-1"
    ports:
      - "127.0.0.1:${STT_HOST_PORT:-8083}:8000"
    networks: [vexa]
    restart: unless-stopped
    mem_limit: ${STT_MEM_LIMIT:-1.5g}

networks:
  vexa:
    name: vexa-net

volumes:
  vexa-pgdata:
  vexa-storagedata:
  vexa-state:
