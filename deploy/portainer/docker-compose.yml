# Vexa Lite as a Portainer stack.
#
# Same three pieces as `make -C deploy/lite up`: the all-in-one control-plane
# container, a Postgres sidecar, and the versitygw storage sidecar. Lite runs
# meeting bots as in-container processes, so this stack needs no Docker socket
# and builds nothing — the images come from Docker Hub.
#
# Secrets are NOT in this file and NOT in the git clone. Portainer deploys the
# stack from the repository, so anything committed here gets overwritten by the
# next re-scan. Put DB_PASSWORD, ADMIN_TOKEN and the MINIO_* pair in the stack's
# Environment section in Portainer instead; compose interpolates those.
#
# Portainer sets COMPOSE_PROJECT_NAME from the stack name, so containers and
# volumes are prefixed with it (vexa_vexa-lite-1, vexa_vexa-pgdata, ...).
name: vexa

x-vexa-env: &vexa-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-vexa}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required - set it in the Portainer stack environment}
  ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required - set it in the Portainer stack environment}
  ADMIN_API_TOKEN: ${ADMIN_TOKEN}
  RUNTIME_API_TOKEN: ${RUNTIME_API_TOKEN:-}
  MINIO_ENDPOINT: storage:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required - set it in the Portainer stack environment}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required - set it in the Portainer stack environment}
  MINIO_BUCKET: ${MINIO_BUCKET:-vexa}
  MINIO_SECURE: "false"
  TRANSCRIPTION_SERVICE_URL: ${TRANSCRIPTION_SERVICE_URL:-}
  TRANSCRIPTION_SERVICE_TOKEN: ${TRANSCRIPTION_SERVICE_TOKEN:-}
  TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-}
  TRANSCRIBE_ENABLED: ${TRANSCRIBE_ENABLED:-}
  RECORDING_ENABLED: ${RECORDING_ENABLED:-}
  VEXA_PUBLIC_API_URL: ${VEXA_PUBLIC_API_URL:-http://localhost:8056}
  TERMINAL_PUBLIC_URL: ${TERMINAL_PUBLIC_URL:-http://localhost:3001}
  TZ: UTC

services:
  vexa-lite:
    # Pin IMAGE_TAG to a release (e.g. v0.12.29) once the stack works, so a
    # re-deploy cannot silently move to a new 0.12 build.
    image: vexaai/vexa-lite:${IMAGE_TAG:-v012}
    # Chromium's sandbox inside the bots needs an unprivileged user namespace,
    # which Docker's default seccomp profile denies. Docker resolves a seccomp
    # profile path on the DAEMON, so a path relative to this file cannot work —
    # install the vendored copy to an absolute host path instead:
    #   ./deploy/portainer/install-seccomp.sh
    # then set SECCOMP_PROFILE in the stack env. Without it bots run with an
    # unsandboxed browser (Lite logs that).
    security_opt:
      - seccomp=${SECCOMP_PROFILE:-unconfined}
    shm_size: 2g
    environment: *vexa-env
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${GATEWAY_HOST_PORT:-8056}:8056"
      - "${BIND_ADDR:-0.0.0.0}:${TERMINAL_HOST_PORT:-3001}:3001"
      - "${BIND_ADDR:-0.0.0.0}:${AGENT_HOST_PORT:-8100}:8100"
    volumes:
      # Persisted minted secrets (terminal sign-in link secret, self-host key).
      # Valkey state and /workspaces are ephemeral inside the container by design.
      - vexa-state:/var/lib/vexa/state
    networks: [vexa]
    restart: unless-stopped
    mem_limit: ${LITE_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD-SHELL", "supervisorctl status gateway >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${DB_NAME:-vexa}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: UTC
      PGTZ: UTC
    command: ["postgres", "-c", "idle_in_transaction_session_timeout=60000"]
    volumes:
      - vexa-pgdata:/var/lib/postgresql/data
    networks: [vexa]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vexa}"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage:
    # Recordings as plain files in the volume: back it up with an attribute-
    # preserving copy (rsync -aX, cp -a) — S3 metadata rides in xattrs.
    image: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
    command:
      - --port
      - :9000
      - --health
      - /health
      - --iam-dir
      - /srv/vexa-storage/iam
      - --quiet
      - posix
      - /srv/vexa-storage/data
    environment:
      ROOT_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      ROOT_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - vexa-storagedata:/srv/vexa-storage
    networks: [vexa]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  # The bucket has to exist before meeting-api writes to it. versitygw's own
  # admin CLI does it in one shot, on the same volume.
  storage-init:
    image: versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        versitygw admin --endpoint-url http://storage:9000 \
          create-bucket --bucket ${MINIO_BUCKET:-vexa} --owner "$$ADMIN_ACCESS_KEY" \
          || echo "bucket ${MINIO_BUCKET:-vexa} already present or create failed"
    environment:
      ADMIN_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      ADMIN_SECRET_KEY: ${MINIO_SECRET_KEY}
    networks: [vexa]
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy

  # Optional CPU Whisper for smoke tests only: tiny.en is English-only, so a
  # Polish meeting needs a real endpoint in TRANSCRIPTION_SERVICE_URL instead.
  # Enable with COMPOSE_PROFILES=local-stt (or the Portainer stack env).
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu@sha256:760e5e43d427dc6cfbbc4731934b908b7de9c7e6d5309c6a1f0c8c923a5b6030
    profiles: [local-stt]
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-tiny.en}
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__TTL: "-1"
    ports:
      - "127.0.0.1:${STT_HOST_PORT:-8083}:8000"
    networks: [vexa]
    restart: unless-stopped
    mem_limit: ${STT_MEM_LIMIT:-1.5g}

networks:
  vexa:
    name: vexa-net

volumes:
  vexa-pgdata:
  vexa-storagedata:
  vexa-state:
