# Client authentication for the Vexa Postgres sidecar.
# The compose service passes this file as -c hba_file, so it applies whether or
# not the data volume still holds an old cluster (Portainer re-deploy keeps the
# volume, and an existing cluster skips image init).
# Postgres publishes no host port: only containers on the stack network reach it.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256
